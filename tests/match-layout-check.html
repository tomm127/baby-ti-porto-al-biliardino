<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BTPB match layout checks</title>
<style>body{font:15px system-ui;margin:20px}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #bbb;max-width:100%;margin:12px 0}label{display:block;margin:8px 0}button{padding:8px}</style>
<h1>BTPB match layout checks</h1><p>Static representative match markup, actual project stylesheet, no Supabase calls. Checks horizontal clipping; vertical scrolling is allowed.</p>
<button id="run">Run all checks</button> <label>Preview <select id="preview"></select></label><pre id="result">Running…</pre><div id="frames"></div>
<script type="module">
const widths=[[320,568],[375,667],[390,844],[393,852],[414,896],[430,932],[844,390]];
const cases=['waiting','countdown','timer','long timer','untimed','score','confirm','finished','alert'];
const a='SupercalifragilisticSquadraConNomeLunghissimo', b='Very long opponent team name with spaces';
const team=(name)=>`<span class="team-label"><span class="team-label-avatar" style="display:inline-block;background:#ceb57b"></span><span class="team-label-text">${name}</span></span>`;
const clock=(value)=>`<div class="match-clock match-clock--time"><svg viewBox="0 0 400 130" role="img" aria-label="${value}"><text x="200" y="104" text-anchor="middle" font-size="120" textLength="376" lengthAdjust="spacingAndGlyphs">${value}</text></svg></div>`;
const controls='<div class="match-controls"><button>Pause</button><button class="danger-soft">End match</button></div>';
const score=`<section class="score-entry"><div class="eyebrow light-text">MATCH FINISHED</div><p>If tied, continue to play the <strong>golden goal</strong>. Then enter the final score.</p><div class="score-inputs"><label><span>${team(a)}</span><input type="number" min="0" inputmode="numeric" value="99"></label><strong>–</strong><label><span>${team(b)}</span><input type="number" min="0" inputmode="numeric" value="100"></label></div>`;
const confirm=`<div class="confirm-result"><strong>Confirm ${a} 99 – 100 ${b}?</strong><p>After confirmation only the admin can change it.</p><div><button>Back</button><button class="confirm">CONFIRM</button></div></div>`;
const contents={waiting:'<div class="waiting-title">You are at the table.</div><button class="giant-button">START MATCH</button>',countdown:'<div class="countdown"><span>3</span><small>GET READY</small></div>',timer:clock('09:59')+'<div class="target-label">First to 10</div>'+controls,'long timer':clock('120:59')+controls,untimed:'<div class="match-clock match-clock--untimed">IN PROGRESS</div>'+controls,score:score+'<button class="giant-button">Check result</button></section>',confirm:score+confirm+'</section>',finished:'<section class="finished-result"><div class="eyebrow light-text">RESULT RECORDED</div><div>99 <span>–</span> 100</div><button>Back to tournament</button></section>',alert:clock('00:00')+controls};
const css=new URL('/src/styles.css',location.href).href;
const doc=(state)=>`<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="${css}"></head><body><main class="match-screen">${state==='alert'?'<div class="match-end-flash" role="button"><strong>TIME IS UP</strong><span>MATCH FINISHED</span><small>TAP TO ENTER THE SCORE</small></div>':''}<header class="match-top"><button class="icon-button light">←</button><div><span>A very long tournament name that should always wrap rather than overflow</span><strong>Table 1</strong></div></header><section class="match-stage"><div class="match-team-names"><strong>${team(a)}</strong><span>VS</span><strong>${team(b)}</strong></div>${contents[state]}</section></main></body></html>`;
const frames=document.querySelector('#frames'), result=document.querySelector('#result'), select=document.querySelector('#preview');
const jobs=widths.flatMap(([w,h])=>cases.map(state=>({w,h,state})));
for(const j of jobs) select.add(new Option(`${j.w} × ${j.h} — ${j.state}`,String(select.length)));
function load(j){return new Promise((resolve,reject)=>{const f=document.createElement('iframe');f.style.width=j.w+'px';f.style.height=j.h+'px';f.style.maxWidth='none';f.onload=()=>resolve(f);f.onerror=reject;f.srcdoc=doc(j.state);frames.replaceChildren(f);});}
function check(f){const d=f.contentDocument,w=f.contentWindow.innerWidth,errors=[];if(!d.styleSheets.length||getComputedStyle(f).display==='none')errors.push('stylesheet/frame missing');const stage=d.querySelector('.match-stage');if(!stage||f.contentWindow.getComputedStyle(stage).containerType!=='inline-size')errors.push('responsive patch missing');if(d.documentElement.scrollWidth>w+2)errors.push('document horizontal overflow');for(const el of d.querySelectorAll('.match-top,.match-top > div,.match-stage,.match-team-names,.team-label,.team-label-text,.match-clock,.match-clock svg,.match-clock text,.countdown span,.score-entry,.score-inputs,.score-inputs label,.score-inputs input,.confirm-result,.finished-result,.finished-result > div,.match-end-flash,.match-end-flash > *,button')){const r=el.getBoundingClientRect();if(r.width&& (r.left < -1||r.right>w+1))errors.push(`${el.tagName}.${typeof el.className==='string'?el.className:''} outside (${Math.round(r.left)},${Math.round(r.right)} / ${w})`);if(el.matches('.team-label-text,.match-clock--untimed,.match-end-flash > *,button,.confirm-result > strong,.finished-result > div:nth-child(2)')&&el.scrollWidth>el.clientWidth+2&&el.clientWidth>0)errors.push(`${el.tagName} text clipping`);}return [...new Set(errors)];}
let running=false;
async function run(){if(running)return;running=true;document.querySelector('#run').disabled=true;select.disabled=true;let pass=0,fail=[];for(const j of jobs){try{const f=await load(j);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const e=check(f);if(e.length)fail.push(`${j.w}×${j.h} ${j.state}: ${e.join('; ')}`);else pass++;}catch(e){fail.push(`${j.w}×${j.h} ${j.state}: ${e}`);}result.textContent=`${pass}/${jobs.length} passed; ${fail.length} failed\n${fail.join('\n')}`;}running=false;document.querySelector('#run').disabled=false;select.disabled=false;await load(jobs[Number(select.value)]);window.btpbLayoutResults={pass,fail,total:jobs.length};}
select.onchange=()=>{if(!running)void load(jobs[Number(select.value)]);};document.querySelector('#run').onclick=run;void run();
</script></html>
